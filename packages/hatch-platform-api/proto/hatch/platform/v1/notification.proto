syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

// Notification center: history, destinations, groups, routes and channels.
// Accepts user sessions and API keys; Run credentials are rejected so Agents
// cannot reconfigure delivery. Device registration requires a user session.
service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
  rpc RetryDelivery(RetryDeliveryRequest) returns (RetryDeliveryResponse);
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);
  // Push a notification as a Channel without its token; routed like a
  // Channel push. Run credentials are rejected like every other method.
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc ListNotificationSources(ListNotificationSourcesRequest) returns (ListNotificationSourcesResponse);
  rpc GetApnsStatus(GetApnsStatusRequest) returns (GetApnsStatusResponse);

  rpc ListDestinations(ListDestinationsRequest) returns (ListDestinationsResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc UpdateDestination(UpdateDestinationRequest) returns (UpdateDestinationResponse);
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse);
  rpc DeleteDestination(DeleteDestinationRequest) returns (DeleteDestinationResponse);

  // Session-only: the device is bound to the calling sign-in session.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  // Push turned off on the phone: disables the device but keeps its routes and
  // groups; RegisterDevice from the same session turns it back on.
  rpc UnregisterDevice(UnregisterDeviceRequest) returns (UnregisterDeviceResponse);
  rpc GetCurrentDevice(GetCurrentDeviceRequest) returns (GetCurrentDeviceResponse);

  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);

  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse);
  rpc DeleteRoute(DeleteRouteRequest) returns (DeleteRouteResponse);

  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc RotateChannelToken(RotateChannelTokenRequest) returns (RotateChannelTokenResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
}

// ---------------------------------------------------------------- history

message NotificationDeliveryCounts {
  uint32 pending = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
}

message NotificationSummary {
  string id = 1;
  // app | channel | platform
  string source_type = 2;
  optional string source_id = 3;
  string source_name = 4;
  string kind = 5;
  string kind_name = 6;
  string title = 7;
  optional string body = 8;
  optional string url = 9;
  // ISO-8601 timestamps.
  string occurred_at = 10;
  string created_at = 11;
  // unrouted | pending | delivered | partial | failed
  string status = 12;
  NotificationDeliveryCounts deliveries = 13;
  // Tapping the phone push opens url instead of the notification.
  bool auto_open_url = 14;
}

message NotificationDelivery {
  string id = 1;
  optional string destination_id = 2;
  // device | webhook | app
  string destination_type = 3;
  string destination_name = 4;
  // pending | in_progress | succeeded | failed
  string status = 5;
  uint32 attempts = 6;
  optional string next_attempt_at = 7;
  optional string last_error = 8;
  optional uint32 http_status = 9;
  // Free-form string an App destination returned; never interpreted.
  optional string result = 10;
  repeated string route_ids = 11;
  optional string completed_at = 12;
  string created_at = 13;
  string updated_at = 14;
}

message NotificationDetail {
  NotificationSummary summary = 1;
  // JSON object, serialized.
  optional string data_json = 2;
  optional string dedupe_key = 3;
  repeated NotificationDelivery deliveries = 4;
}

message ListNotificationsRequest {
  optional string source_type = 1 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "platform"
    ]
  }];
  optional string source_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
  optional string kind = 3 [(buf.validate.field).string.max_len = 64];
  optional string status = 4 [(buf.validate.field).string = {
    in: [
      "unrouted",
      "pending",
      "delivered",
      "partial",
      "failed"
    ]
  }];
  optional string cursor = 5 [(buf.validate.field).string.max_len = 64];
  uint32 limit = 6 [(buf.validate.field).uint32.lte = 100];
}
message ListNotificationsResponse {
  repeated NotificationSummary notifications = 1;
  optional string next_cursor = 2;
}

message GetNotificationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message GetNotificationResponse {
  NotificationDetail notification = 1;
}

message RetryDeliveryRequest {
  string delivery_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RetryDeliveryResponse {}

message SendTestNotificationRequest {
  string destination_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message SendTestNotificationResponse {
  string notification_id = 1;
}

// Same fields and limits as the Channel push body.
message SendNotificationRequest {
  string channel_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string kind = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,63}$"];
  // At most 200 characters after trimming, checked by the shared Channel
  // push rules so both paths accept the same titles.
  string title = 3 [(buf.validate.field).string.min_len = 1];
  optional string body = 4 [(buf.validate.field).string.max_len = 4000];
  // Absolute http(s) URL.
  optional string url = 5 [(buf.validate.field).string.max_len = 2048];
  // JSON object, at most 32 KiB serialized.
  optional string data_json = 6 [(buf.validate.field).string.max_len = 65536];
  // Repeats from the same Channel return the first notification.
  optional string dedupe_key = 7 [(buf.validate.field).string.max_len = 200];
  // ISO-8601 timestamp; defaults to now.
  optional string occurred_at = 8 [(buf.validate.field).string.max_len = 64];
  // Tapping the phone push opens url instead of the notification. Unset
  // defaults to whether url is set; false keeps the notification page; true
  // requires url.
  optional bool auto_open_url = 9;
}
message SendNotificationResponse {
  string notification_id = 1;
  // True when dedupe_key matched an earlier notification from this Channel.
  bool deduplicated = 2;
  // Deliveries queued by matching routes; 0 for a duplicate.
  uint32 delivery_count = 3;
}

message NotificationKind {
  string kind = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,63}$"];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
}

message NotificationAppSource {
  string id = 1;
  string slug = 2;
  string name = 3;
  repeated NotificationKind kinds = 4;
}

message NotificationChannelSource {
  string id = 1;
  string name = 2;
  repeated NotificationKind kinds = 3;
}

message ListNotificationSourcesRequest {}
message ListNotificationSourcesResponse {
  repeated NotificationAppSource apps = 1;
  repeated NotificationChannelSource channels = 2;
}

message GetApnsStatusRequest {}
message GetApnsStatusResponse {
  // builtin | environment
  string source = 1;
  optional string topic = 2;
  bool production = 3;
  bool sandbox = 4;
  optional string error = 5;
}

// ---------------------------------------------------------------- destinations

message NotificationDeviceInfo {
  string platform = 1;
  // sandbox | production
  string environment = 2;
  string user_id = 3;
  optional string user_name = 4;
  string session_id = 5;
}

message NotificationWebhookInfo {
  string url = 1;
}

message NotificationAppInfo {
  string app_id = 1;
  optional string slug = 2;
  // Whether the live deployment still declares notifications.destination.
  bool accepting = 3;
}

message NotificationDestination {
  string id = 1;
  // device | webhook | app
  string type = 2;
  string name = 3;
  bool enabled = 4;
  optional string last_error = 5;
  repeated string group_ids = 6;
  string created_at = 7;
  string updated_at = 8;
  NotificationDeviceInfo device = 9;
  NotificationWebhookInfo webhook = 10;
  NotificationAppInfo app = 11;
}

message ListDestinationsRequest {}
message ListDestinationsResponse {
  repeated NotificationDestination destinations = 1;
}

message CreateWebhookRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  string url = 2 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
}
message CreateWebhookResponse {
  NotificationDestination destination = 1;
  // Shown once; used to verify x-hatch-signature on deliveries.
  string secret = 2;
}

message UpdateDestinationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional bool enabled = 3;
  optional string url = 4 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
}
message UpdateDestinationResponse {
  NotificationDestination destination = 1;
}

message RotateWebhookSecretRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RotateWebhookSecretResponse {
  string secret = 1;
}

message DeleteDestinationRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteDestinationResponse {}

message RegisterDeviceRequest {
  // Initial display name. An already registered device keeps its current
  // name; rename it with UpdateDestination.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  string platform = 2 [(buf.validate.field).string = {
    in: ["ios"]
  }];
  // Hex APNs device token.
  string apns_token = 3 [(buf.validate.field).string.pattern = "^[0-9a-fA-F]{16,200}$"];
  string apns_environment = 4 [(buf.validate.field).string = {
    in: [
      "sandbox",
      "production"
    ]
  }];
  // Identifies the end-to-end key on the device; echoed in each push.
  string e2e_key_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{8,64}$"];
  // 32-byte AES-256-GCM key, base64url without padding.
  string e2e_key = 6 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$"];
}
message RegisterDeviceResponse {
  NotificationDestination destination = 1;
}

message UnregisterDeviceRequest {}
message UnregisterDeviceResponse {}

message GetCurrentDeviceRequest {}
message GetCurrentDeviceResponse {
  NotificationDestination destination = 1;
}

// ---------------------------------------------------------------- groups

message NotificationGroup {
  string id = 1;
  string name = 2;
  optional string description = 3;
  repeated string destination_ids = 4;
  string created_at = 5;
  string updated_at = 6;
  // Device destinations created later join this group automatically.
  bool auto_add_devices = 7;
}

message NotificationDestinationIds {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message ListGroupsRequest {}
message ListGroupsResponse {
  repeated NotificationGroup groups = 1;
}

message CreateGroupRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 2 [(buf.validate.field).string.max_len = 500];
  NotificationDestinationIds destination_ids = 3;
  // New device destinations join the group when they register. Existing
  // devices are not added. Defaults to false.
  optional bool auto_add_devices = 4;
}
message CreateGroupResponse {
  NotificationGroup group = 1;
}

message UpdateGroupRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
  // When present, replaces the full member list.
  NotificationDestinationIds destination_ids = 4;
  // Changes whether device destinations created from now on join the group.
  // Current members are unchanged.
  optional bool auto_add_devices = 5;
}
message UpdateGroupResponse {
  NotificationGroup group = 1;
}

message DeleteGroupRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteGroupResponse {}

// ---------------------------------------------------------------- routes

message NotificationRoute {
  string id = 1;
  optional string name = 2;
  // app | channel | any
  string source_type = 3;
  // Absent: any source of source_type.
  optional string source_id = 4;
  // Absent: any kind.
  optional string kind = 5;
  // group | destination
  string target_type = 6;
  string target_id = 7;
  bool enabled = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListRoutesRequest {}
message ListRoutesResponse {
  repeated NotificationRoute routes = 1;
}

message CreateRouteRequest {
  optional string name = 1 [(buf.validate.field).string.max_len = 80];
  string source_type = 2 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  optional string source_id = 3 [(buf.validate.field).string.max_len = 191];
  optional string kind = 4 [(buf.validate.field).string.max_len = 64];
  string target_type = 5 [(buf.validate.field).string = {
    in: [
      "group",
      "destination"
    ]
  }];
  string target_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 7;
}
message CreateRouteResponse {
  NotificationRoute route = 1;
}

message UpdateRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string.max_len = 80];
  optional string source_type = 3 [(buf.validate.field).string = {
    in: [
      "app",
      "channel",
      "any"
    ]
  }];
  // Empty string clears the source (any source of source_type).
  optional string source_id = 4 [(buf.validate.field).string.max_len = 191];
  // Empty string clears the kind (any kind).
  optional string kind = 5 [(buf.validate.field).string.max_len = 64];
  optional string target_type = 6 [(buf.validate.field).string = {
    in: [
      "group",
      "destination"
    ]
  }];
  optional string target_id = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional bool enabled = 8;
}
message UpdateRouteResponse {
  NotificationRoute route = 1;
}

message DeleteRouteRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteRouteResponse {}

// ---------------------------------------------------------------- channels

message NotificationChannel {
  string id = 1;
  string name = 2;
  optional string description = 3;
  repeated NotificationKind kinds = 4;
  bool enabled = 5;
  // POST target; authenticate with x-hatch-secret or ?secret=.
  string push_url = 6;
  string created_at = 7;
  string updated_at = 8;
}

message NotificationKindList {
  repeated NotificationKind kinds = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
  }];
}

message ListChannelsRequest {}
message ListChannelsResponse {
  repeated NotificationChannel channels = 1;
}

message CreateChannelRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 2 [(buf.validate.field).string.max_len = 500];
  NotificationKindList kinds = 3 [(buf.validate.field).required = true];
}
message CreateChannelResponse {
  NotificationChannel channel = 1;
  // Shown once.
  string token = 2;
}

message UpdateChannelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 500];
  // When present, replaces the full kind list.
  NotificationKindList kinds = 4;
  optional bool enabled = 5;
}
message UpdateChannelResponse {
  NotificationChannel channel = 1;
}

message RotateChannelTokenRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message RotateChannelTokenResponse {
  string token = 1;
}

message DeleteChannelRequest {
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}
message DeleteChannelResponse {}
