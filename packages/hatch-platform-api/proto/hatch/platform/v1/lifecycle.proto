syntax = "proto3";

package hatch.platform.v1;

import "google/protobuf/struct.proto";

// Safe resource projection, without secrets or raw database rows.
message Resource {
  string id = 1;
  string slug = 2;
  string name = 3;
  optional string description = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  // Complete allowlisted JSON inspection/summary, including nullable values.
  google.protobuf.Value view = 8;
}

message Source {
  string id = 1;
  optional string master_commit = 2;
  optional bytes bundle = 3;
}

message Deployment {
  string deployment_id = 1;
  uint32 version = 2;
  uint32 compatibility_version = 3;
  optional string slug = 4;
  google.protobuf.Value normalized = 5;
}

message Compatibility {
  uint32 version = 1;
  uint32 latest_version = 2;
  uint32 minimum_supported_version = 3;
  bool is_supported = 4;
  bool is_latest = 5;
}

message RestoredVersion {
  uint32 version = 1;
  Compatibility compatibility = 2;
  // Only populated for App rollback.
  optional bool data_schema_mismatch = 3;
}
