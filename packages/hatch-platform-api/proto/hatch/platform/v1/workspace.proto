syntax = "proto3";

package hatch.platform.v1;

// Shared instance navigation is available only to signed-in user sessions.
service WorkspaceService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
}

message GetWorkspaceRequest {}

message DashboardSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  bool pinned = 4;
  uint32 auto_refresh_seconds = 5;
}

message AppPin {
  // Pin identity, not App identity: one App can have multiple entries.
  string id = 1;
  string app_id = 2;
  string label = 3;
  // Bare fragment without '#'; empty opens the App root.
  string entry_hash = 4;
  string app_slug = 5;
}

message GetWorkspaceResponse {
  // Includes unpinned dashboards, in the same order as the web UI.
  repeated DashboardSummary dashboards = 1;
  // Preserve server order and duplicate App entries; excludes archived Apps.
  repeated AppPin app_pins = 2;
  // Web sidebar order; excludes archived Workflows.
  repeated string pinned_workflow_ids = 3;
}
