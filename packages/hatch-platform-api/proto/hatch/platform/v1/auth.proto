syntax = "proto3";

package hatch.platform.v1;

import "buf/validate/validate.proto";

service AuthService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Exchange an existing Better Auth session for a one-use browser POST ticket.
  // API keys and Run credentials cannot create interactive browser sessions.
  rpc CreateHandoff(CreateHandoffRequest) returns (CreateHandoffResponse);
}

message AppHandoffTarget {
  // Immutable App ID. Unlike the legacy App RPC, this does not resolve slugs.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
  }];
}

message DashboardHandoffTarget {
  // Immutable Dashboard ID; the server selects the existing Dashboard page.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 191
    pattern: "^[A-Za-z0-9_-]+$"
  }];
}

message CreateHandoffRequest {
  // Exactly one resource, never a caller-supplied URL or redirect path.
  oneof target {
    option (buf.validate.oneof).required = true;
    AppHandoffTarget app = 1;
    DashboardHandoffTarget dashboard = 2;
  }
}

message CreateHandoffResponse {
  // POST application/x-www-form-urlencoded with only ticket=<ticket> here.
  string url = 1;
  // One use, at most 60 seconds. Never put this or session tokens in a URL.
  string ticket = 2;
  string expires_at = 3;
  // Informational, server-selected destination of the consume endpoint's 303.
  string target_path = 4;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
}

message SessionCredential {
  User user = 1;
}

message ApiKeyCredential {
  User user = 1;
  string id = 2;
  optional string name = 3;
}

message RunCredential {
  string run_id = 1;
  string session_id = 2;
  string runner_id = 3;
}

message GetStatusRequest {}

// All successfully authenticated public callers have full platform authority.
message GetStatusResponse {
  optional string expires_at = 1;
  oneof credential {
    option (buf.validate.oneof).required = true;
    SessionCredential session = 2;
    ApiKeyCredential api_key = 3;
    RunCredential run = 4;
  }
}
