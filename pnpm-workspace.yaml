allowBuilds:
  '@bufbuild/buf': false
  '@google/genai': false
  '@prisma/client': false
  '@prisma/engines': false
  better-sqlite3: false
  esbuild: true
  lefthook: true
  playwright: true
  prisma: false
  protobufjs: false

overrides:
  # Device grant fields cross Better Auth's Zod type boundary. Use the same
  # supported Zod minor as the platform instead of two nominal schema types.
  zod: 4.6.5
  'protobufjs@7.6.4': 7.6.5
  'seroval@<=1.5.2': ^1.5.3
  'tsyringe>tslib': 2.8.1

patchedDependencies:
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
