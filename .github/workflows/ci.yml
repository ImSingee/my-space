name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm check:types

      - name: Run linter
        run: pnpm lint

      - name: Build
        run: pnpm build

  tailscale:
    name: Tailscale connection helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/tailscale/go.mod
          cache-dependency-path: packages/tailscale/go.sum
      - name: Check proxy boundaries and build helper
        working-directory: packages/tailscale
        run: |
          go test ./...
          CGO_ENABLED=0 go build -trimpath .
