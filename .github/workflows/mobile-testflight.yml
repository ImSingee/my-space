name: Mobile TestFlight

# Builds the iOS app on EAS with the `production` profile and submits it to
# TestFlight. The `production` submit profile in mobile/eas.json limits the
# build to the internal tester group.
#
# Required repository secret:
#   EXPO_TOKEN - an Expo access token for the app's owner account.
# The iOS distribution credentials and an App Store Connect API key must
# already be stored on EAS (`pnpm --dir mobile eas credentials --platform ios`), so
# the non-interactive build and submission never prompt for Apple sign-in.

on:
  workflow_dispatch:
    inputs:
      what_to_test:
        description: 'TestFlight "What to Test" notes (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Set the EXPO_TOKEN repository secret first.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build on EAS and submit to TestFlight
        working-directory: mobile
        env:
          BUILD_MESSAGE: ${{ github.ref_name }}@${{ github.sha }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: |
          args=(
            build
            --platform ios
            --profile production
            --auto-submit
            --non-interactive
            --freeze-credentials
            --message "${BUILD_MESSAGE:0:64}"
          )
          if [ -n "$WHAT_TO_TEST" ]; then
            args+=(--what-to-test "$WHAT_TO_TEST")
          fi
          pnpm eas "${args[@]}"
